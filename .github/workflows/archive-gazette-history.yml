name: Archive Original Gazette Git History
on:
  push:
    paths:
      - '.github/workflows/archive-gazette-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone complete original repository history
        run: |
          set -euo pipefail
          git clone https://github.com/cookiecodespy/cookiecodespy.github.io.git "$RUNNER_TEMP/gazette-history-original"
      - name: Filter the original project subtree preserving commit history
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/gazette-history-original" subtree split --prefix=ai-race-gazette -b gazette-history
          git fetch "$RUNNER_TEMP/gazette-history-original" gazette-history
          git log -1 --format="Filtered Gazette history head: %H %s" FETCH_HEAD
          git push origin FETCH_HEAD:refs/heads/archive/original-gazette-history
          echo "Filtered original Gazette commit history archived on a separate branch"
