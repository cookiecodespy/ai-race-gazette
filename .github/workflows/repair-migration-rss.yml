name: One-time Gazette RSS migration repair
on:
  push:
    paths:
      - '.github/workflows/repair-migration-rss.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gazette-rss-migration
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate RSS mirrors from canonical JSON with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Race Gazette Migration"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            (
              cd source
              python3 scripts/editorial.py
              cp public/feed.xml ../feed.xml
            )
            cmp feed.xml source/public/feed.xml
            cmp data/news.json source/public/data/news.json
            git add feed.xml source/public/feed.xml
            if git diff --cached --quiet; then
              echo "RSS already correct"
              exit 0
            fi
            git commit -m "fix: regenerate chronological RSS mirrors after migration"
            if git push origin HEAD:main; then
              echo "RSS regenerated and published atomically"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Cannot push safely after three rebases"
          exit 1
