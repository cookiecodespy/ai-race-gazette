name: Import AI Race Gazette into dedicated repository

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-gazette.yml'

permissions:
  contents: write

concurrency:
  group: initial-gazette-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout new dedicated repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read source repository without modifying it
        env:
          SOURCE_REPO: https://github.com/cookiecodespy/cookiecodespy.github.io.git
        run: |
          set -euo pipefail
          git clone --depth=1 "$SOURCE_REPO" "$RUNNER_TEMP/gazette-source"
          test -s "$RUNNER_TEMP/gazette-source/ai-race-gazette/data/news.json"
          test -s "$RUNNER_TEMP/gazette-source/ai-race-gazette/source/package.json"
          git -C "$RUNNER_TEMP/gazette-source" rev-parse HEAD > "$RUNNER_TEMP/gazette-source-sha"

      - name: Copy full project including images
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/gazette-source/ai-race-gazette/." "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows
          cp -a "$RUNNER_TEMP/gazette-source/.github/workflows/." .github/workflows/
          touch .nojekyll

      - name: Adapt CI workflows and canonical repository references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for file in Path(".github/workflows").glob("*.yml"):
              if file.name == "import-gazette.yml":
                  continue
              content = file.read_text()
              content = content.replace("ai-race-gazette/", "")
              file.write_text(content)
          old_repo = "cookiecodespy/cookiecodespy.github.io"
          new_repo = "cookiecodespy/ai-race-gazette"
          for file in [Path("README.md"), Path("source/AGENTS.md"), Path("source/docs/scheduled-task.md"), Path("source/docs/automation-operations.md")]:
              if not file.is_file():
                  continue
              content = file.read_text()
              content = content.replace(old_repo + "/ai-race-gazette", new_repo)
              content = content.replace(old_repo, new_repo)
              if file.name == "scheduled-task.md":
                  content = content.replace("`ai-race-gazette/data/news.json`", "`data/news.json`")
                  content = content.replace("`ai-race-gazette/feed.xml`", "`feed.xml`")
                  content = content.replace("`ai-race-gazette/source/public/data/news.json`", "`source/public/data/news.json`")
                  content = content.replace("`ai-race-gazette/source/public/feed.xml`", "`source/public/feed.xml`")
                  content = content.replace("`ai-race-gazette/source/docs/history-coverage.json`", "`source/docs/history-coverage.json`")
              if file.name == "AGENTS.md":
                  content = content.replace("preserve the repository root page", "preserve Gazette root deployment files")
                  content = content.replace("preserve the repository root", "preserve Gazette root deployment")
                  content = content.replace("preserve the root portfolio page", "preserve Gazette root deployment files")
              file.write_text(content)
          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          sha = Path(__import__("os").environ["RUNNER_TEMP"], "gazette-source-sha").read_text().strip()
          (docs/"repository-migration.md").write_text(
            "# Dedicated repository migration\n\n"
            "Source: `cookiecodespy/cookiecodespy.github.io/ai-race-gazette`\n\n"
            f"Source commit: `{sha}`\n\n"
            "The user portfolio and the source repository were not modified by this import. "
            "The new repository root holds the former `ai-race-gazette/` contents, "
            "and the four Gazette workflows were relocated to `.github/workflows/` and rebased to the new root.\n\n"
            "GitHub Pages must serve this repository from `main` / `(root)`. "
            "Do not remove the source project's published files until the new site passes live checks.\n",
            encoding="utf-8"
          )
          PY

      - name: Verify copied editorial mirrors and required files
        run: |
          set -euo pipefail
          cmp data/news.json source/public/data/news.json
          cmp feed.xml source/public/feed.xml
          test -f source/docs/history-coverage.json
          test -f source/visual/asset-manifest.json
          test -f source/AGENTS.md
          test -f source/package-lock.json
          test -f assets/reference-look.jpg
          test -f source/public/assets/reference-look.jpg
          test -f .github/workflows/build-ai-race-gazette.yml
          test -f .github/workflows/validate-ai-race-gazette-content.yml
          python3 -m json.tool data/news.json >/dev/null
          python3 -m json.tool source/visual/asset-manifest.json >/dev/null
          cmp assets/reference-look.jpg source/public/assets/reference-look.jpg
          echo "Copied content and binary asset checks passed"

      - name: Commit only to the dedicated repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Race Gazette Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "migration: import Gazette project from portfolio [skip ci]"
          git push origin HEAD:main
          echo "Gazette imported to dedicated repository"
